{% extends 'base.html' %}

{% block title %}Sign Up - Career Lains AI{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; width: 100%;">
    <div class="glass-card" style="padding: 40px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 60px; height: 60px; background: var(--purple-gradient); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 16px; box-shadow: var(--shadow-purple-glow);">
                🎓
            </div>
            <h2 style="font-size: 28px; font-weight: 800;">Create Your Account</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-top: 6px;">Accelerate your placement preparation with AI</p>
        </div>

        <form action="{{ url_for('signup') }}" method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="student@college.edu" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-crosshairs"></i> Target Role</label>
                    <select name="target_role" class="form-control">
                        <option value="Software Engineer">Software Engineer</option>
                        <option value="Frontend Developer">Frontend Developer</option>
                        <option value="Backend Developer">Backend Developer</option>
                        <option value="Data Analyst">Data Analyst</option>
                        <option value="Cloud Engineer">Cloud Engineer</option>
                        <option value="Full Stack Developer">Full Stack Developer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fa-solid fa-graduation-cap"></i> Status</label>
                    <select name="experience_level" class="form-control">
                        <option value="Fresher / Student">Fresher / Student</option>
                        <option value="0-1 Year Experience">0-1 Year Experience</option>
                        <option value="1-3 Years Experience">1-3 Years Experience</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-purple" style="width: 100%; margin-top: 10px; padding: 14px;">
                <i class="fa-solid fa-user-plus"></i> Create Free Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-glass); color: var(--text-muted); font-size: 14px;">
            Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 600;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
